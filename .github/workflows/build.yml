name: Build executables

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04        # older glibc = runs on more distros
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gui/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt pyinstaller

      - name: Syntax check
        run: python -m py_compile gui/pckswf_gui.py gui/ops.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          # The GUI only uses QtCore / QtGui / QtWidgets: exclude every other Qt module (and unused stdlib bloat).
          EXCLUDES=""
          for m in Qt3DAnimation Qt3DCore Qt3DExtras Qt3DInput Qt3DLogic Qt3DRender QtBluetooth QtCharts \
                   QtConcurrent QtDataVisualization QtDesigner QtHelp QtMultimedia QtMultimediaWidgets \
                   QtNetwork QtNetworkAuth QtNfc QtOpenGL QtOpenGLWidgets QtPdf QtPdfWidgets QtPositioning \
                   QtQml QtQuick QtQuick3D QtQuickControls2 QtQuickWidgets QtRemoteObjects QtScxml QtSensors \
                   QtSerialPort QtSql QtStateMachine QtTest QtTextToSpeech QtUiTools QtWebChannel \
                   QtWebEngineCore QtWebEngineQuick QtWebEngineWidgets QtWebSockets QtWebView QtXml; do
            EXCLUDES="$EXCLUDES --exclude-module PySide6.$m"
          done
          for m in numpy PIL.ImageTk PIL.ImageQt tkinter unittest pydoc test lib2to3 sqlite3 matplotlib scipy pandas IPython; do
            EXCLUDES="$EXCLUDES --exclude-module $m"
          done
          pyinstaller --noconfirm --clean --windowed \
            --name pckswf-gui \
            --paths . --paths gui \
            --collect-all qt_themes \
            --hidden-import ops \
            --hidden-import rpck --hidden-import pck2swf --hidden-import swf2pck --hidden-import swfimport \
            --hidden-import swfr --hidden-import swfw --hidden-import tess --hidden-import swfbitmap \
            --hidden-import pckfont --hidden-import sheetfont --hidden-import fonttex \
            --hidden-import fontTools.ttLib --hidden-import PIL \
            $EXCLUDES \
            gui/pckswf_gui.py

      - name: Trim unused Qt files
        shell: bash
        run: |
          # software OpenGL fallback, PDF/Network/QML/Quick libs, translations and unused plugins are not needed by a QtWidgets app
          find dist/pckswf-gui \( -iname 'opengl32sw.dll' -o -iname 'd3dcompiler_47.dll' \
               -o -iname '*Qt6Pdf*' -o -iname '*Qt6Network*' -o -iname '*Qt6Qml*' -o -iname '*Qt6Quick*' \
               -o -iname '*Qt6VirtualKeyboard*' -o -iname '*Qt6OpenGL*' -o -iname '*Qt6Svg*' \) -type f -print -delete || true
          find dist/pckswf-gui -type d \( -name translations -o -name qml -o -name tls -o -name networkinformation \) -print -exec rm -rf {} + || true
          du -sh dist/pckswf-gui

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a -tzip release/pckswf-gui-windows-x64.zip ./dist/pckswf-gui
          else
            tar -C dist -czf release/pckswf-gui-linux-x64.tar.gz pckswf-gui
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pckswf-gui-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
