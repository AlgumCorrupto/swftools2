name: Build executables

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04        # older glibc = runs on more distros
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gui/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt pyinstaller

      - name: Syntax check
        run: python -m py_compile gui/pckswf_gui.py gui/ops.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name pckswf-gui \
            --paths . --paths gui \
            --collect-all qt_themes \
            --hidden-import ops \
            --hidden-import rpck --hidden-import pck2swf --hidden-import swf2pck --hidden-import swfimport \
            --hidden-import swfr --hidden-import swfw --hidden-import tess --hidden-import swfbitmap \
            --hidden-import pckfont --hidden-import sheetfont --hidden-import fonttex \
            --hidden-import fontTools.ttLib --hidden-import PIL --hidden-import numpy \
            gui/pckswf_gui.py

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a -tzip release/pckswf-gui-windows-x64.zip ./dist/pckswf-gui
          else
            tar -C dist -czf release/pckswf-gui-linux-x64.tar.gz pckswf-gui
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pckswf-gui-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
